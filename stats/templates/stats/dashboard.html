        <div class="skeleton" style="width: 4.4rem; height: 0.7rem;"></div>
      </div>
      <div class="skeleton-card skeleton-card--center">

      </div>
      <div class="skeleton-card skeleton-card--center">

        <div class="skeleton" style="width: 4.4rem; height: 0.7rem;"></div>

    <div class="skeleton" style="width: 11rem; height: 1.1rem; margin-bottom: 1.1rem;"></div>
    <div class="skeleton-grid skeleton-grid--6">
      <div class="skeleton skeleton-poster"></div>
      <div class="skeleton skeleton-poster"></div>
      <div class="skeleton skeleton-poster"></div>
      <div class="skeleton skeleton-poster"></div>
      <div class="skeleton skeleton-poster"></div>
      <div class="skeleton skeleton-poster"></div>
    </div>
  </div>

  <script>
    // The dashboard's real content (dozens of queries, real wall-clock cost on
    // Render's free-tier CPU/cold start) is fetched async instead of computed
    // inline -- this shell renders instantly with a skeleton placeholder above,
    // then swaps in the fetched HTML once it arrives, so a cold Render instance
    // or an uncached dashboard shows a loading transition instead of a blank tab.
    (function () {
      const container = document.getElementById('dashboard-content');
      const loadingBar = document.getElementById('dashboard-loading-bar');

      // innerHTML never executes the <script> tags it inserts (share-button
      // handler, chart-data json_script + its Chart.js init, section-nav scroll
      // spy -- all inline in the fetched fragment), so each one is recreated as a
      // fresh element and swapped in; that DOES execute, letting the fetched
      // fragment's own scripts run exactly as if they'd loaded with the page.
      function injectWithScripts(target, html) {
        target.innerHTML = html;
        target.querySelectorAll('script').forEach(function (oldScript) {
          const newScript = document.createElement('script');
          for (const attr of oldScript.attributes) newScript.setAttribute(attr.name, attr.value);
          newScript.textContent = oldScript.textContent;
          oldScript.parentNode.replaceChild(newScript, oldScript);
        });
      }

      fetch('{{ content_url }}')
        .then(function (response) {
          if (!response.ok) throw new Error('bad response');
          return response.text();
        })
        .then(function (html) {
          injectWithScripts(container, html);
          if (loadingBar) loadingBar.remove();
        })
        .catch(function () {
          container.innerHTML = (
            '<div class="card muted">Something went wrong loading your stats. '
            + '<a href="javascript:location.reload()">Try refreshing</a>.</div>'
          );
          if (loadingBar) loadingBar.remove();
        });
    })();
  </script>
{% endblock %}
